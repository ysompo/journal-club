{% extends "base.html" %}
{% block title %}Admin Login · Journal Club{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-6 py-20">
  <div class="flex items-center gap-3 mb-8">
    <span class="material-symbols-outlined text-3xl text-primary">admin_panel_settings</span>
    <div>
      <h1 class="font-headline text-xl font-bold text-on-surface">Admin access</h1>
      <p class="text-xs text-slate-400">Email configuration is restricted.</p>
    </div>
  </div>

  <form method="POST" class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
    <div class="px-5 py-4 flex items-center gap-4">
      <label class="w-24 text-sm font-semibold text-on-surface-variant flex-shrink-0">Password</label>
      <input type="password" name="password" autofocus
        placeholder="••••••••"
        class="flex-1 bg-transparent border border-slate-200 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-primary">
    </div>
    {% if error %}
    <div class="px-5 py-3 text-sm text-red-600 bg-red-50">{{ error }}</div>
    {% endif %}
    <div class="px-5 py-4">
      <button type="submit"
        class="flex items-center gap-2 px-5 py-2 rounded-lg bg-primary text-white font-semibold text-sm hover:bg-primary-container transition-colors">
        <span class="material-symbols-outlined text-base">lock_open</span>
        Sign in
      </button>
    </div>
  </form>
</div>
{% endblock %}
