services:
  - type: web
    name: journal-club
    runtime: python-3.14
    buildCommand: pip install -r requirements.txt && playwright install
    startCommand: gunicorn --workers=1 --threads=4 --timeout=120 wsgi:app
    healthCheckPath: /tools/journal-club
    envVars:
      - key: FLASK_ENV
        value: production
